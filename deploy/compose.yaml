services:
  # 1. Official Checkmk Raw
  checkmk:
    image: checkmk/check-mk-raw:2.4.0-latest
    container_name: checkmk
    restart: unless-stopped
    hostname: checkmk
    # Bug fixed 2026-09-07: PING/check_icmp services reported CRIT with
    # "Return code of 126 is out of bounds - plugin may not be executable"
    # against every host. check_icmp needs a raw ICMP socket (file
    # capability cap_net_raw=ep on the binary, live-verified via `getcap`),
    # but rootless Podman's default container capability set excludes
    # CAP_NET_RAW (confirmed via `cat /proc/self/status` inside the
    # container: CapBnd had bit 13 clear, and `podman inspect`'s CapAdd was
    # empty) — the kernel refuses to grant a file capability that isn't in
    # the container's own bounding set, which surfaces as exactly this
    # "exec: Operation not permitted" / RC 126, unrelated to any actual
    # network/NAT reachability to the polled devices.
    cap_add:
      - NET_RAW
    environment:
      - CMK_SITE_ID=${CMK_SITE_ID:-dmc}
      - CMK_PASSWORD=cmkadmin
      # Documented Checkmk container variable (docs.checkmk.com/latest/en/
      # introduction_docker.html, "Additional environment variables"): the
      # entrypoint runs `omd config set LIVESTATUS_TCP on` for the site
      # when it is created. Without it a wiped/recreated checkmk_data volume
      # comes back with Livestatus-over-TCP off (seen live 2026-09-24) and
      # the poller and wizard's Livestatus checks fail until it is set by hand.
      # It does NOT cover LIVESTATUS_TCP_TLS (no such variable exists); see
      # the pre-start hook mounted under `volumes:` below.
      - CMK_LIVESTATUS_TCP=on
      - TZ=Asia/Singapore
    ports:
      - "8080:5000"     # Web UI
      - "8000:8000"     # Agent TLS registration
      - "6556:6556"     # Agent pull mode
    volumes:
      - checkmk_data:/omd/sites
      - /etc/localtime:/etc/localtime:ro
      # Bug fixed 2026-09-25: a fresh 2.4 site defaults to LIVESTATUS_TCP_TLS=on,
      # which makes port 6557 speak TLS only and breaks the plain-LQL poller and
      # wizard. The docker docs list no env var for it, so this pre-start hook
      # turns it off. Verified from the entrypoint source (Checkmk/checkmk,
      # branch 2.4.0, docker_image/docker-entrypoint.sh): pre-start hooks run as
      # root before `omd start`, with the site stopped, on every container start
      # (so it also repairs an already-created site). Not verified: (a) whether
      # the image ships its own files in /docker-entrypoint.d/pre-start/ (hence
      # a single-file mount, not the directory); (b) whether the entrypoint
      # runs under `set -e` (hence the hook always exits 0); (c) that the
      # 2.4.0-latest tag's entrypoint matches branch 2.4.0.
      - ./checkmk-hooks/pre-start/10-livestatus-tcp-plaintext.sh:/docker-entrypoint.d/pre-start/10-livestatus-tcp-plaintext.sh:ro,z
    tmpfs:
      - /omd/sites/${CMK_SITE_ID:-dmc}/tmp:rw,size=512M,mode=1777
    networks:
      - cmk_net

  # 2. Mosquitto Broker
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"     # plain MQTT — stays LAN-published for debugging (D-04),
                          # now requires "poller" credentials instead of anonymous
      - "9002:9001"     # WebSockets — host 9002 avoids colliding with minio's
                          # own published console port (host 9001) below
    environment:
      - MQTT_POLLER_PASSWORD=${MQTT_POLLER_PASSWORD:?run deploy/init-env.sh}
      - WS_PASSWORD=${WS_PASSWORD:?run deploy/init-env.sh}
      - ADMIN_WS_PASSWORD=${ADMIN_WS_PASSWORD:?run deploy/init-env.sh}
      - CMK_SITE_ID=${CMK_SITE_ID:-dmc}
    # Quick 260930-jj4: the Mosquitto passwords (a third broker user, wsadmin, was added for the dashboard admin mode) now live only in deploy/.env,
    # generated by deploy/init-env.sh — the previously tracked credential file and
    # its generator script are removed. This entrypoint builds
    # /mosquitto/config/mosquitto.passwd itself, in the container's writable layer,
    # on every start, then execs the image's own ENTRYPOINT + CMD.
    #
    # Verified against eclipse-mosquitto:2 (github.com/eclipse-mosquitto/mosquitto,
    # branch master, docker/2.0-openssl/Dockerfile, VERSION=2.0.22, alpine:3.23):
    # - The image has no USER directive (starts as root); user/group `mosquitto` is
    #   uid/gid 1883. /mosquitto/config is an ordinary image-layer directory (only
    #   /mosquitto/data and /mosquitto/log are VOLUMEs), so a root process here can
    #   create /mosquitto/config/mosquitto.passwd in the writable container layer.
    # - ENTRYPOINT ["/docker-entrypoint.sh"], CMD ["/usr/sbin/mosquitto", "-c",
    #   "/mosquitto/config/mosquitto.conf"]. docker-entrypoint.sh (#!/bin/ash, set -e)
    #   chowns /mosquitto to mosquitto:mosquitto when run as uid 0, then execs "$@" —
    #   which is why this entrypoint execs that same script plus its original CMD
    #   rather than replacing them: the image's own root-owned startup step still runs.
    # Verified against Mosquitto 2.0.22 (tag v2.0.22):
    # - src/mosquitto.c drop_privileges() runs before mosquitto_security_init(), so
    #   the password file is opened as uid 1883, not root.
    # - common/misc_mosq.c mosquitto__fopen(restrict_read) warns "world readable
    #   permissions" when the file has any "other" bits set, and "owner is not
    #   <user>" when its owner isn't the running uid — hence chown mosquitto:mosquitto
    #   + chmod 0700 below, with no world bits at all.
    #
    # Phase 14.3: the topic ACL is rendered the same way. Mosquitto ACL files have
    # no env expansion, so deploy/render-mosquitto-acl.sh fills @SITE_ID@ in
    # mosquitto.acl.template from CMK_SITE_ID (same default as the poller and
    # dashboard services; all three must agree). An invalid site id makes the
    # script exit non-zero, and `set -eu` aborts the container start.
    #
    # `${VAR:?}` here deliberately diverges from the "avoid :?" convention explained
    # on the grafana service below (10-REVIEW CR-01): these two passwords have no
    # safe default, and deploy/init-env.sh is now the mandatory first step for a
    # fresh deploy/.env, so failing the whole `compose up` with "run
    # deploy/init-env.sh" is preferred over silently falling back to a fixed,
    # publicly-known default credential (user-approved design, quick 260930-jj4).
    entrypoint:
      - "/bin/sh"
      - "-c"
      - >-
        set -eu;
        umask 077;
        mosquitto_passwd -c -b /mosquitto/config/mosquitto.passwd poller "$$MQTT_POLLER_PASSWORD";
        mosquitto_passwd -b /mosquitto/config/mosquitto.passwd wsreader "$$WS_PASSWORD";
        mosquitto_passwd -b /mosquitto/config/mosquitto.passwd wsadmin "$$ADMIN_WS_PASSWORD";
        chown mosquitto:mosquitto /mosquitto/config/mosquitto.passwd;
        chmod 0700 /mosquitto/config/mosquitto.passwd;
        sh /mosquitto/render-acl.sh /mosquitto/acl.template /mosquitto/config/mosquitto.acl;
        chown mosquitto:mosquitto /mosquitto/config/mosquitto.acl;
        chmod 0700 /mosquitto/config/mosquitto.acl;
        exec /docker-entrypoint.sh /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
    volumes:
      # was ./mosquitto.conf:/etc/mosquitto/mosquitto.conf:ro,z — the image's
      # baked-in CMD only reads /mosquitto/config/mosquitto.conf, so the old
      # path silently never loaded the custom config
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro,z
      - ./mosquitto.acl.template:/mosquitto/acl.template:ro,z
      - ./render-mosquitto-acl.sh:/mosquitto/render-acl.sh:ro,z
      - mosquitto_data:/mosquitto/data:z
      - mosquitto_log:/mosquitto/log:z
    networks:
      - cmk_net

  # 3. MinIO S3 Object Storage
  minio:
    # Bug fixed 2026-09-30: minio/minio was removed from Docker Hub
    # (2026-09-11), so a fresh pull of the old minio/minio:latest 404s.
    # quay.io/minio/minio is no fallback either: its registry API now answers
    # UNAUTHORIZED to anonymous pulls (a control repo on quay.io still worked).
    # Chainguard's free tier only publishes :latest, so it is pinned by digest
    # (index digest verified against the cgr.dev registry API, 2026-09-30).
    # Its entrypoint is /usr/bin/minio (so `command:` below is unchanged) and it
    # runs as non-root UID 65532; the image's /data is mode 777, so a fresh
    # minio_data volume works. A volume written by the old root-run image needs
    # `podman unshare chown -R 65532:65532 <volume mountpoint>` once.
    # Long-term exit: moving to AWS S3 removes this dependency on MinIO's own
    # release cadence entirely (D-41).
    image: cgr.dev/chainguard/minio:latest@sha256:71674988a1c7ddd5724928633199152b11e4ddefd6c6ce2d60772ff4a8f22ca9
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"     # S3 API Endpoint
      - "9001:9001"     # Web Console
    volumes:
      - minio_data:/data:z
    networks:
      - cmk_net

  # 3a. MinIO bucket bootstrap — creates the buckets ClickHouse's S3 disk and
  # the poller's rollup writer need, and makes fleet-availability anonymous
  # download-only so nginx's read-only proxy (deploy/dashboard-nginx.conf)
  # never needs a MinIO credential (D-54/D-56). Idempotent: reruns on every
  # `podman compose up` (`mc mb --ignore-existing`/`mc anonymous set` are safe
  # to repeat). On AWS S3 the equivalent is a bucket policy set once as a
  # deployment step, not code (D-41).
  minio-init:
    # latest-dev is used deliberately, not latest: the latest-dev variant
    # ships busybox `sh`/`sleep`, while plain `latest` has `mc`/`bash` but no
    # `sleep` (checked from the image layers 2026-09-30). Chainguard's free
    # tier only publishes `latest`/`latest-dev`, so this is pinned by digest,
    # same reasoning as the `minio` service above.
    image: cgr.dev/chainguard/minio-client:latest-dev@sha256:19c80ef13b3bec25196b00c24345195f0d0e1305a339cebf6dc7d44b85782817
    container_name: minio-init
    # Quick 261002-liq: no `depends_on: minio` here on purpose. podman-compose
    # turns it into `--requires=minio`, and clickhouse (which requires both
    # minio and minio-init) then fails on a fresh `up -d` with "container
    # <minio-init> depends on container <minio> not found in input list":
    # minio is already running by then, so podman leaves it out of the start
    # list while minio-init's requirement on it is still unresolved (grafana
    # fails the same way through clickhouse). Ordering is not needed: the
    # entrypoint below retries `mc alias set` until MinIO answers.
    restart: "no"
    environment:
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      # The image runs as non-root UID 65532; `mc alias set` writes its config
      # under $HOME, which is otherwise unset for that UID.
      - HOME=/tmp
    # The script is the third element of a list-form entrypoint, the same form
    # the grafana service uses. Bug fixed 2026-09-30 (first live start): it
    # used to be a plain-string `command:` after `entrypoint: [sh, -c]`, but
    # compose splits a string command on whitespace, so `sh -c` received only
    # "until" as its script (and "mc" as $0). The container exited with "mc:
    # line 0: syntax error: unexpected end of file (expecting "do")", no bucket
    # was created, and clickhouse crash-looped on its missing S3 disk bucket.
    entrypoint:
      - "/usr/bin/sh"
      - "-c"
      - >-
        until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do sleep 2; done &&
        mc mb --ignore-existing local/clickhouse-s3-disk &&
        mc mb --ignore-existing local/fleet-availability &&
        mc anonymous set download local/fleet-availability
    networks:
      - cmk_net

  # 3b. ClickHouse — S3-tiered metric/state history store (D-23/D-40/D-41).
  # Init scripts under ./clickhouse-config/initdb run only on the first start
  # of an empty clickhouse_data volume, so every CH_* secret below must be set
  # in deploy/.env BEFORE that first start (see deploy/.env.example).
  clickhouse:
    image: clickhouse/clickhouse-server:26.9.4.3
    container_name: clickhouse
    restart: unless-stopped
    depends_on:
      - minio
      - minio-init
    environment:
      - CLICKHOUSE_USER=ch_admin
      - CLICKHOUSE_PASSWORD=${CH_ADMIN_PASSWORD:-}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - CH_WRITER_PASSWORD=${CH_WRITER_PASSWORD:-}
      - CH_READER_PASSWORD=${CH_READER_PASSWORD:-}
      - CH_GRAFANA_PASSWORD=${CH_GRAFANA_PASSWORD:-}
      # Bucket URL plus a key prefix ending in "/" (objects land under data/).
      # Bug fixed 2026-09-30 (first live start): the trailing double slash from
      # ClickHouse's MinIO integration guide made 26.9.4.3 crash-loop with
      # "Code: 36. Invalid S3 key: '/' (http://minio:9000/clickhouse-s3-disk//)";
      # see deploy/clickhouse-config/config.d/s3-storage.xml. For AWS S3,
      # repoint this at the regional bucket URL plus prefix instead (D-41).
      - CH_S3_DISK_ENDPOINT=http://minio:9000/clickhouse-s3-disk/data/
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
    # No `ports:` — HTTP 8123 stays on cmk_net only, like checkmk's own REST
    # port 5000. The native protocol port 9000 would collide with MinIO's
    # published 9000 and nothing in this stack uses it (RESEARCH.md Open
    # Question 1).
    volumes:
      - clickhouse_data:/var/lib/clickhouse:z
      - ./clickhouse-config/config.d/s3-storage.xml:/etc/clickhouse-server/config.d/s3-storage.xml:ro,z
      - ./clickhouse-config/initdb:/docker-entrypoint-initdb.d:ro,z
    networks:
      - cmk_net

  # 3c. Grafana — analyst-facing dashboards over ClickHouse, alongside the
  # dashboard, never replacing it (D-22/D-55).
  grafana:
    image: grafana/grafana:13.2.2
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - clickhouse
    ports:
      - "3000:3000"     # Grafana UI — clear of 8080/8000/6556/1883/9000/9001/9002/8090
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PLUGINS_PREINSTALL=grafana-clickhouse-datasource
      - CH_GRAFANA_PASSWORD=${CH_GRAFANA_PASSWORD:-}
      - TZ=Asia/Singapore
    # HIST-10: refuse to start with an empty or default "admin" password. A
    # guard here (rather than a `${GRAFANA_ADMIN_PASSWORD:?}` interpolation)
    # is required because compose interpolates the whole file before
    # selecting services — a required-value guard there would also block
    # checkmk/mosquitto from starting on a first-time deploy (10-REVIEW CR-01
    # reasoning, same as every other secret in this file except the MQTT
    # passwords — see the mosquitto service above).
    entrypoint:
      - "/bin/sh"
      - "-c"
      - >-
        if [ -z "$$GF_SECURITY_ADMIN_PASSWORD" ] || [ "$$GF_SECURITY_ADMIN_PASSWORD" = "admin" ]; then
          echo "ERROR: GRAFANA_ADMIN_PASSWORD is empty or the default 'admin'. Set a real password in deploy/.env, then recreate this container." >&2;
          exit 1;
        fi;
        exec /run.sh
    volumes:
      - ./grafana-provisioning:/etc/grafana/provisioning:ro,z
      - grafana_data:/var/lib/grafana:z
    networks:
      - cmk_net

  # 4. Automation Worker (Python 3.12 + uv) — runs checkmk-wizard (§8) and
  # any other scripts placed under ./app, e.g. the MQTT publisher.
  worker:
    image: python:3.12-slim
    container_name: automation-worker
    restart: unless-stopped
    working_dir: /app
    volumes:
      # Bug fixed 2026-09-07: this was "./app:/app:z", correct only for the
      # pre-Phase-9 layout where compose.yaml lived at checkmk-stack/deploy/
      # (a sibling of checkmk-stack/app/). The 09-03 poller service's
      # "../scripts" mount required moving compose.yaml to live inside the
      # repo checkout itself (checkmk-stack/app/checkmk-wizard/deploy/, see
      # docs/Podman setup...md §2), which silently broke this path: "./app"
      # then resolved to an empty auto-created deploy/app/ instead of the
      # checkmk-stack/app/ directory the repo actually lives in. "../.."
      # from deploy/ lands on checkmk-stack/app/, matching §8.1's promise
      # that the repo lands in the worker container at /app/checkmk-wizard.
      - ../..:/app:z
    environment:
      # Quick 261002-nlp: keep the worker's uv virtualenv out of the bind-mounted checkout.
      # `uv sync` in the container used to create <checkout>/.venv with its python symlink
      # pointing at the container's own uv Python (under the container's /root), which the
      # host user cannot resolve, so a host `uv run` in the checkout failed with
      # "failed to canonicalize path .venv/bin/python3: Permission denied". With this
      # variable the container's venv lives in the container (rebuilt by run-wizard.sh's
      # `uv sync` after a recreate) and the host's .venv is the host's alone.
      - UV_PROJECT_ENVIRONMENT=/opt/checkmk-wizard-venv
      - CMK_REST_API=http://checkmk:5000/${CMK_SITE_ID:-dmc}/check_mk/api/1.0
      - CMK_SITE=${CMK_SITE_ID:-dmc}
      # Same name/value as the checkmk service's own CMK_SITE_ID above —
      # checkmk-wizard reads this (if present) to pre-fill its site-name
      # prompt in container mode, since it has no local 'omd' to list
      # sites with and no network-based way to discover one either.
      - CMK_SITE_ID=${CMK_SITE_ID:-dmc}
      # Address of the machine running Podman, as LAN hosts see it (set it
      # in deploy/.env). checkmk-wizard shows it in Phase 5 as the
      # address Linux/Windows agents register against — the worker can't
      # discover it itself, since it only sees its own 10.89.x.x bridge
      # address. Compose publishes 8000 (registration) and 6556 (pull) on it.
      - CMK_PUBLIC_HOST=${CMK_PUBLIC_HOST:-}
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      # Phase 10.1 (OPS-01): same four CMK_REST_* variable names as the
      # poller service's own block below -- see its comment there for the
      # full explanation of the `${CMK_REST_SECRET:-}` empty-default
      # indirection. The wizard PUSHES this value into Checkmk as the
      # `automation` user's secret (create or update), so worker and poller
      # share the one value chosen in deploy/.env. The worker needs these
      # too: the wizard's own re-run
      # and scripts/probe_host_attribute_merge.py both execute inside this
      # container and would otherwise need a hand-pasted secret
      # (10-06-SUMMARY.md finding 2).
      - CMK_REST_HOST=checkmk
      - CMK_REST_PORT=5000
      - CMK_REST_USERNAME=automation
      - CMK_REST_SECRET=${CMK_REST_SECRET:-}
      # Amended 2026-09-30 (quick 260930-hpy): the wizard pushes this value
      # into Checkmk as the scoped topology_editor user's secret right
      # after Phase 1 (src/checkmk_wizard/wizard.py:_provision_topology_editor),
      # same create-or-rotate pattern as CMK_REST_SECRET above.
      - TOPOLOGY_EDITOR_SECRET=${TOPOLOGY_EDITOR_SECRET:-}
    command: >
      bash -c "pip install --no-cache-dir uv &&
               tail -f /dev/null"
    networks:
      - cmk_net

  # 5. Livestatus to MQTT Poller
  poller:
    image: python:3.12-slim
    container_name: mqtt-poller
    restart: unless-stopped
    depends_on:
      - checkmk
      - mosquitto
    working_dir: /scripts
    volumes:
      # ../scripts resolves relative to this compose file's own directory
      # (deploy/), so `podman compose` must be run from the repo checkout's
      # deploy/ directory (see docs/Podman setup for checkmk, minio,
      # mosquitto, worker.md §2/§4). Set POLLER_SCRIPTS_DIR to an absolute
      # path for layouts that differ. Mounted read-only, and mounts the
      # git-tracked scripts/ directory rather than the uncommitted ./app
      # (see the worker service's own volume above) so a fresh checkout
      # deploys without a manual copy step.
      - ${POLLER_SCRIPTS_DIR:-../scripts}:/scripts:ro,z
    # tzdata is required (not optional): python:3.12-slim ships no IANA
    # timezone database, and the availability rollup's day boundary math
    # needs a real "Asia/Singapore" zoneinfo entry (RESEARCH.md Pitfall 3).
    command: >
      bash -c "pip install --no-cache-dir paho-mqtt==2.1.0 boto3==1.43.105 tzdata==2026.4 &&
               exec python -u /scripts/mqtt_poller.py"
    environment:
      - LIVESTATUS_HOST=checkmk
      - LIVESTATUS_PORT=6557
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      # Quick 260930-jj4: MQTT_POLLER_PASSWORD is generated into deploy/.env by
      # deploy/init-env.sh and fed to the mosquitto service's own entrypoint
      # (see above), which builds the broker's password file from the same
      # value — so both sides always agree. Rotate by editing deploy/.env,
      # then `podman compose down && podman compose up -d` (supersedes the old
      # tracked credential file and its generator script).
      - MQTT_USERNAME=poller
      - MQTT_PASSWORD=${MQTT_POLLER_PASSWORD:?run deploy/init-env.sh}
      - POLL_INTERVAL_SECONDS=15
      - RECONCILE_TIMEOUT_SECONDS=5
      - EVENTS_MAX_ENTRIES=1000
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      # Phase 10 (D-03/D-04): the poller's folder-lookup REST call.
      # CMK_SITE_ID is the same name/value the checkmk and worker services
      # above already set, so this is one value to configure, not three.
      # CMK_REST_PORT=5000 is the check-mk-raw image's internal REST/GUI
      # port, reachable over cmk_net without publishing anything to the
      # host. CMK_REST_SECRET is interpolated from deploy/.env (gitignored)
      # rather than written here, so the automation user's real secret never
      # lands in a tracked file; copy deploy/.env.example to deploy/.env and
      # choose it BEFORE the first wizard run — the wizard provisions Checkmk
      # to match; recreate the poller (`podman compose up -d poller`) after
      # changing it — see
      # "First-time credential setup" in
      # docs/Podman setup for checkmk, minio, mosquitto, worker.md §3.
      # An unset secret (empty default below) is a silent degradation, not a
      # crash: the poller keeps running and keeps publishing status, but
      # every device's `folder` field comes back empty. It must default to
      # empty rather than a required-with-error interpolation: compose
      # interpolates variables when it parses the whole file, before
      # selecting services, so a required-value guard here would also block
      # `checkmk` and `mosquitto` from starting on a first-time deployment —
      # before the automation secret this variable demands can even exist
      # (fixed 2026-09-11, see 10-REVIEW.md CR-01).
      - CMK_REST_HOST=checkmk
      - CMK_REST_PORT=5000
      - CMK_SITE_ID=${CMK_SITE_ID:-dmc}
      - CMK_REST_USERNAME=automation
      - CMK_REST_SECRET=${CMK_REST_SECRET:-}
      # Phase 14.1 (HIST-04/05/10): fleet history store. clickhouse is
      # deliberately NOT added to depends_on above — history is enrichment,
      # so the poller must start and keep publishing status even if
      # ClickHouse is down (D-44); an unreachable ClickHouse just drops that
      # cycle's rows, which reads as "no data" (D-47).
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_WRITER_USER=poller_writer
      - CLICKHOUSE_WRITER_PASSWORD=${CH_WRITER_PASSWORD:-}
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_REGION=us-east-1
      - S3_ADDRESSING_STYLE=path
      - AVAILABILITY_BUCKET=fleet-availability
      - ROLLUP_TZ=Asia/Singapore
      - ROLLUP_BACKFILL_DAYS=28
      - ROLLUP_DELAY_MINUTES=5
    networks:
      - cmk_net

  # 6. Live Dashboard — static nginx, no server-side process. Per-deployment
  # dashboard settings (Checkmk site name, read-only broker credentials,
  # TOPOLOGY_EDITOR_SECRET) all come from this environment: block, rendered by
  # deploy/dashboard-nginx.conf at container start (amended 2026-09-30, quick
  # 260930-ixs) — none of them is baked into the image, so the same image
  # runs on every machine.
  dashboard:
    # React dashboard, built into its own nginx image (cutover 2026-09-28; it
    # replaced the vanilla ../dashboard bind mount). Rebuild after every
    # `git pull` (code changes only; per-machine settings come from
    # deploy/.env at container start): `podman compose build dashboard`.
    build:
      context: ..
      dockerfile: deploy/dashboard.Containerfile
    image: localhost/checkmk-dashboard:latest
    container_name: dashboard
    restart: unless-stopped
    # nginx resolves `checkmk` for the /checkmk-api/ proxy when it starts.
    depends_on:
      - checkmk
    # Phase 14.1 (D-54): the /ch-api/ and /availability/ locations in
    # deploy/dashboard-nginx.conf resolve their upstreams (clickhouse, minio)
    # per request via a resolver, not at nginx startup — so the dashboard
    # deliberately does NOT depend_on clickhouse or minio; a stopped history
    # container only 502s its own path, never blocks the dashboard container
    # from starting.
    environment:
      - CH_READER_PASSWORD=${CH_READER_PASSWORD:-}
      - NGINX_ENTRYPOINT_LOCAL_RESOLVERS=1
      # Amended 2026-09-30 (quick 260930-hpy): nginx injects this as the
      # Authorization header on the allow-listed /checkmk-api/ REST calls
      # (deploy/dashboard-nginx.conf) — it never reaches the browser.
      - TOPOLOGY_EDITOR_SECRET=${TOPOLOGY_EDITOR_SECRET:-}
      # Added 2026-09-30 (quick 260930-ixs): rendered into the /config.json
      # location in deploy/dashboard-nginx.conf, which the SPA loads at
      # startup (dashboard-react/src/lib/runtimeConfig.ts).
      - CMK_SITE_ID=${CMK_SITE_ID:-dmc}
      - WS_USERNAME=${WS_USERNAME:-wsreader}
      - WS_PASSWORD=${WS_PASSWORD:?run deploy/init-env.sh}
      # Admin mode: rendered into /admin-config.json in deploy/dashboard-nginx.conf;
      # fetched by the SPA only with ?admin=1.
      - ADMIN_WS_USERNAME=${ADMIN_WS_USERNAME:-wsadmin}
      - ADMIN_WS_PASSWORD=${ADMIN_WS_PASSWORD:?run deploy/init-env.sh}
    ports:
      - "8090:80"       # dashboard UI — host 8090 is clear of 8080/8000/6556
                          # checkmk, 1883 mqtt, 9000/9001 minio and 9002
                          # mosquitto-WS, so 8090 was free to claim (D-04)
    networks:
      - cmk_net

volumes:
  checkmk_data:
  mosquitto_data:
  mosquitto_log:
  minio_data:
  clickhouse_data:
  grafana_data:

networks:
  cmk_net:
    driver: bridge
