services:
  # 1. Official Checkmk Raw
  checkmk:
    image: checkmk/check-mk-raw:2.4.0-latest
    container_name: checkmk
    restart: unless-stopped
    hostname: checkmk
    # Bug fixed 2026-09-07: PING/check_icmp services reported CRIT with
    # "Return code of 126 is out of bounds - plugin may not be executable"
    # against every host. check_icmp needs a raw ICMP socket (file
    # capability cap_net_raw=ep on the binary, live-verified via `getcap`),
    # but rootless Podman's default container capability set excludes
    # CAP_NET_RAW (confirmed via `cat /proc/self/status` inside the
    # container: CapBnd had bit 13 clear, and `podman inspect`'s CapAdd was
    # empty) — the kernel refuses to grant a file capability that isn't in
    # the container's own bounding set, which surfaces as exactly this
    # "exec: Operation not permitted" / RC 126, unrelated to any actual
    # network/NAT reachability to the polled devices.
    cap_add:
      - NET_RAW
    environment:
      - CMK_SITE_ID=dmc
      - CMK_PASSWORD=cmkadmin
      - TZ=Asia/Singapore
    ports:
      - "8080:5000"     # Web UI
      - "8000:8000"     # Agent TLS registration
      - "6556:6556"     # Agent pull mode
    volumes:
      - checkmk_data:/omd/sites
      - /etc/localtime:/etc/localtime:ro
    tmpfs:
      - /omd/sites/dmc/tmp:rw,size=512M,mode=1777
    networks:
      - cmk_net

  # 2. Mosquitto Broker
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"     # plain MQTT — stays LAN-published for debugging (D-04),
                          # now requires "poller" credentials instead of anonymous
      - "9002:9001"     # WebSockets — host 9002 avoids colliding with minio's
                          # own published console port (host 9001) below
    volumes:
      # was ./mosquitto.conf:/etc/mosquitto/mosquitto.conf:ro,z — the image's
      # baked-in CMD only reads /mosquitto/config/mosquitto.conf, so the old
      # path silently never loaded the custom config
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro,z
      - ./mosquitto.acl:/mosquitto/config/mosquitto.acl:ro,z
      - ./mosquitto.passwd:/mosquitto/config/mosquitto.passwd:ro,z
      - mosquitto_data:/mosquitto/data:z
      - mosquitto_log:/mosquitto/log:z
    networks:
      - cmk_net

  # 3. MinIO S3 Object Storage
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"     # S3 API Endpoint
      - "9001:9001"     # Web Console
    volumes:
      - minio_data:/data:z
    networks:
      - cmk_net

  # 4. Automation Worker (Python 3.12 + uv) — runs checkmk-wizard (§8) and
  # any other scripts placed under ./app, e.g. the MQTT publisher.
  worker:
    image: python:3.12-slim
    container_name: automation-worker
    restart: unless-stopped
    working_dir: /app
    volumes:
      # Bug fixed 2026-09-07: this was "./app:/app:z", correct only for the
      # pre-Phase-9 layout where compose.yaml lived at checkmk-stack/deploy/
      # (a sibling of checkmk-stack/app/). The 09-03 poller service's
      # "../scripts" mount required moving compose.yaml to live inside the
      # repo checkout itself (checkmk-stack/app/checkmk-wizard/deploy/, see
      # docs/Podman setup...md §2), which silently broke this path: "./app"
      # then resolved to an empty auto-created deploy/app/ instead of the
      # checkmk-stack/app/ directory the repo actually lives in. "../.."
      # from deploy/ lands on checkmk-stack/app/, matching §8.1's promise
      # that the repo lands in the worker container at /app/checkmk-wizard.
      - ../..:/app:z
    environment:
      - CMK_REST_API=http://checkmk:5000/dmc/check_mk/api/1.0
      - CMK_SITE=dmc
      # Same name/value as the checkmk service's own CMK_SITE_ID above —
      # checkmk-wizard reads this (if present) to pre-fill its site-name
      # prompt in container mode, since it has no local 'omd' to list
      # sites with and no network-based way to discover one either.
      - CMK_SITE_ID=dmc
      # Same name/value as the checkmk service's own CMK_PASSWORD above —
      # checkmk-wizard reads this (if present) to pre-fill its cmkadmin
      # password prompt in container mode. Keep in sync with the checkmk
      # service's CMK_PASSWORD value.
      - CMK_PASSWORD=cmkadmin
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
    command: >
      bash -c "pip install --no-cache-dir uv &&
               tail -f /dev/null"
    networks:
      - cmk_net

  # 5. Livestatus to MQTT Poller
  poller:
    image: python:3.12-slim
    container_name: mqtt-poller
    restart: unless-stopped
    depends_on:
      - checkmk
      - mosquitto
    working_dir: /scripts
    volumes:
      # ../scripts resolves relative to this compose file's own directory
      # (deploy/), so `podman compose` must be run from the repo checkout's
      # deploy/ directory (see docs/Podman setup for checkmk, minio,
      # mosquitto, worker.md §2/§4). Set POLLER_SCRIPTS_DIR to an absolute
      # path for layouts that differ. Mounted read-only, and mounts the
      # git-tracked scripts/ directory rather than the uncommitted ./app
      # (see the worker service's own volume above) so a fresh checkout
      # deploys without a manual copy step.
      - ${POLLER_SCRIPTS_DIR:-../scripts}:/scripts:ro,z
    command: >
      bash -c "pip install --no-cache-dir paho-mqtt==2.1.0 &&
               exec python -u /scripts/mqtt_poller.py"
    environment:
      - LIVESTATUS_HOST=checkmk
      - LIVESTATUS_PORT=6557
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      # Disposable Phase 8 credentials already in deploy/mosquitto.passwd;
      # rotate via deploy/gen-mosquitto-passwd.sh (see §3's "First-time
      # credential setup"), same as this stack's other default credentials.
      - MQTT_USERNAME=poller
      - MQTT_PASSWORD=poller
      - POLL_INTERVAL_SECONDS=60
      - RECONCILE_TIMEOUT_SECONDS=5
      - HISTORY_MAX_ENTRIES=20
      - EVENTS_MAX_ENTRIES=50
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    networks:
      - cmk_net

volumes:
  checkmk_data:
  mosquitto_data:
  mosquitto_log:
  minio_data:

networks:
  cmk_net:
    driver: bridge
