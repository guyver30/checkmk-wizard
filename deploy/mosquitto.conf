# Mosquitto broker configuration for the checkmk-wizard MQTT bridge.
# Source: mosquitto.conf(5) man page (mosquitto.org/man/mosquitto-conf-5.html).
# Container-side paths here MUST match the bind mounts in deploy/compose.yaml
# (the eclipse-mosquitto image's baked-in CMD only reads /mosquitto/config/mosquitto.conf,
# not /etc/mosquitto/mosquitto.conf).

# --- global settings (apply to all listeners; per_listener_settings left
#     at its default `false`, so one acl_file/password_file pair covers
#     both listeners below, scoped per-username rather than per-listener) ---
# Globals are declared before any "listener" line deliberately: directives
# after a "listener" line are scoped to that listener, so keeping every
# global setting up front avoids ambiguity for a future reader.
allow_anonymous false
password_file /mosquitto/config/mosquitto.passwd
acl_file /mosquitto/config/mosquitto.acl

persistence true
persistence_location /mosquitto/data/
# autosave_interval defaults to 1800s (30 min); tightened here given this
# milestone's low message volume.
autosave_interval 60

# --- listeners ---
listener 1883 0.0.0.0
# no "protocol" line -> defaults to plain MQTT; used by the poller

listener 9001 0.0.0.0
protocol websockets
