# nginx config for the React dashboard (dashboard-react/README.md §8 cutover checklist).
#
# This file is an envsubst TEMPLATE (deploy/dashboard.Containerfile installs it at
# /etc/nginx/templates/default.conf.template). Only ${CH_READER_PASSWORD} and
# ${NGINX_LOCAL_RESOLVERS} are substituted at container start, because the official
# nginx image's entrypoint script only substitutes variable names that are present in
# the container's own environment (verified 2026-09-30 against
# github.com/nginxinc/docker-nginx entrypoint/20-envsubst-on-templates.sh:
# `defined_envs` is built from `awk '... for (name in ENVIRON) ...'`, so nginx's own
# runtime variables such as $uri/$arg_*/$is_args/$args are never touched — they are
# not environment variables). Plan 14.1-06 sets CH_READER_PASSWORD and
# NGINX_ENTRYPOINT_LOCAL_RESOLVERS=1 on the dashboard service.
#
# Per D-50, no dashboard history views exist yet — the /ch-api/ and /availability/
# locations below exist only so a future dashboard view (or 14.2) has a read-only,
# same-origin path to reach; this phase proves the path works and that writes are
# impossible through it.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Resolve upstreams (clickhouse, minio) per request via a resolver, rather than
    # nginx's default of resolving proxy_pass hostnames once at startup, so a stopped
    # history container yields a 502 on its own path instead of preventing the whole
    # dashboard from starting (the existing /checkmk-api/ keeps its static proxy_pass
    # and relies on the checkmk container's own depends_on/startup ordering instead).
    # NGINX_LOCAL_RESOLVERS is exported by the image's own
    # entrypoint/15-local-resolvers.envsh when NGINX_ENTRYPOINT_LOCAL_RESOLVERS is set
    # (verified 2026-09-30 against the same docker-nginx repo: the script reads
    # /etc/resolv.conf's nameserver lines and exports them as NGINX_LOCAL_RESOLVERS).
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

    # SPA fallback: a cold-loaded /details?id=... bookmark must get index.html, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin route to Checkmk's REST API, the production twin of vite.config.ts's
    # dev/preview proxy. Checkmk answers no CORS preflight (13-01 VERDICT V-CORS), so the
    # browser has to reach it through the origin that served the page. A forwarding rule
    # only: no auth or logic is added; the browser still sends its own Bearer credential.
    location /checkmk-api/ {
        proxy_pass http://checkmk:5000/;
    }

    # Read-only, same-origin path to ClickHouse's HTTP interface (D-24/D-54/D-56).
    # Two independent read-only layers protect this: (1) nginx allows GET only and
    # rejects any client-supplied user/password query args below; (2) ClickHouse's own
    # readonly=1 settings profile on the dashboard_reader user enforces read-only at
    # the server itself regardless of what reaches it (verified via context7 against
    # ClickHouse's ContextAccess.cpp: HTTP GET forces readonly=1 server-side; see
    # 14.1-RESEARCH.md Summary/Pattern 5). This nginx layer is defense-in-depth, not
    # the sole guarantee.
    location = /ch-api/ {
        limit_except GET { deny all; }

        # A client must not pick another ClickHouse user via query args.
        if ($arg_user) { return 403; }
        if ($arg_password) { return 403; }

        # proxy_set_header replaces any client-sent X-ClickHouse-User/Key or
        # Authorization header before the request reaches ClickHouse, so the browser
        # cannot switch identities by sending its own headers.
        proxy_set_header Authorization "";
        proxy_set_header X-ClickHouse-User dashboard_reader;
        proxy_set_header X-ClickHouse-Key "${CH_READER_PASSWORD}";

        # nginx's proxy_pass does not support user:password@ in the upstream URL for
        # arbitrary HTTP backends the way it does for a small set of protocols, which is
        # why the credential travels as headers above rather than in the URL
        # (ClickHouse HTTP interface docs: X-ClickHouse-User/X-ClickHouse-Key are its
        # documented header-based auth mechanism).
        set $ch_upstream clickhouse;
        proxy_pass http://$ch_upstream:8123/$is_args$args;
    }

    # Bare prefix (no trailing slash) and catch-all: everything else under /ch-api/,
    # including ClickHouse's own /ch-api/play, /ch-api/ping, /ch-api/replicas_status,
    # /ch-api/dashboard admin/UI endpoints, must 404 rather than reach ClickHouse or
    # fall through to the SPA's index.html.
    location = /ch-api { return 404; }
    location /ch-api/ { return 404; }

    # Read-only, same-origin path to the two rollup object shapes in the
    # fleet-availability bucket (D-53/D-57). No credential is forwarded to MinIO: the
    # bucket carries an anonymous download-only policy (plan 14.1-06), so even a
    # request that reached here with a write method could not succeed against MinIO
    # either — this location is the second, redundant layer. A named regex capture
    # (rollup_key) is used instead of $1 because a later `set`/regex evaluation could
    # clobber a numbered capture group. Only these two exact key shapes are proxied,
    # so bucket listing (which would need an unconstrained prefix or query string) is
    # impossible through this path.
    location ~ "^/availability/(?<rollup_key>availability/[0-9]{4}/[0-9]{2}/[0-9]{4}-[0-9]{2}-[0-9]{2}\.json|availability_parquet/date=[0-9]{4}-[0-9]{2}-[0-9]{2}/availability\.parquet)$" {
        limit_except GET { deny all; }
        proxy_set_header Authorization "";
        set $minio_upstream minio;
        proxy_pass http://$minio_upstream:9000/fleet-availability/$rollup_key;
    }

    # Bare prefix and catch-all: any other path under /availability/ (including a
    # bucket-listing attempt) 404s rather than reaching MinIO or falling through to
    # the SPA's index.html.
    location = /availability { return 404; }
    location /availability/ { return 404; }
}
