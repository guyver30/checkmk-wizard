# nginx config for the React dashboard (dashboard-react/README.md §8 cutover checklist).
server {
    listen 80;
    root /usr/share/nginx/html;

    # SPA fallback: a cold-loaded /details?id=... bookmark must get index.html, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin route to Checkmk's REST API, the production twin of vite.config.ts's
    # dev/preview proxy. Checkmk answers no CORS preflight (13-01 VERDICT V-CORS), so the
    # browser has to reach it through the origin that served the page. A forwarding rule
    # only: no auth or logic is added; the browser still sends its own Bearer credential.
    location /checkmk-api/ {
        proxy_pass http://checkmk:5000/;
    }
}
