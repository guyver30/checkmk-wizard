# Provider fields verified via context7 (grafana/grafana,
# docs/sources/tutorials/provision-dashboards-and-data-sources/index.md and
# pkg/services/provisioning/dashboards/types.go, checked 2026-09-30).
apiVersion: 1

providers:
  - name: fleet-history
    folder: Fleet history
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false
