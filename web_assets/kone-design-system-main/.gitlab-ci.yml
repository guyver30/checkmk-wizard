variables:
  DOMAIN_OWNER: 182629041483
  APP_DOMAIN: kone-iot
  ARTIFACT_REPOSITORY: npm
  ARTIFACT_TOOL: npm
  URL_ENV_AWS: https://kone-iot-182629041483.d.codeartifact.eu-west-1.amazonaws.com

include:
    project: "konecorporation/r-d/devops/ci-cd/templates"
    ref: 1.2.5
    file:
        - ci/configure-aws-codeartifact.gitlab-ci.yml

stages:
  - build
  - verify
  - deploy
  - release

workflow:
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG


default:
  image: $ECR_GL_REGISTRY/aws-sam-cli-node18
  tags:
    - kone-ux

build:
  stage: build
  extends:
    - .configure-aws-codeartifact
  script:
    - npm install --force
    - npm run build
  rules:
    - if: $CI_COMMIT_BRANCH != "main"

cdk:synth:
  stage: verify
  extends:
    - .configure-aws-codeartifact
  variables:
    # Using dev environment variables for testing the synth
    ENVIRONMENT_NAME: "dev"
    UI_DOMAIN: $UI_DOMAIN
    UI_SUBDOMAIN: 'www'
    CFN_ROLE_ARN: $CFN_ROLE_ARN_SANDBOX
    DEPLOY_ROLE_ARN: $DEPLOY_ROLE_ARN_SANDBOX
  script:
    - cd ./deploy/static-web-content
    - npm ci --cache .npm --prefer-offline
    - cd $CI_PROJECT_DIR
    - source ./tools/assume-role.sh
    - cd ./deploy/static-web-content
    - npm run cdk synth UIResource -- -- require-approval never --role-arn $CFN_ROLE_ARN
  rules:
    - if: $CI_COMMIT_BRANCH != "main"

### Deploy Storybook to DEV ###
deploy:storybook:dev:
  stage: deploy
  variables:
    ENVIRONMENT_NAME: "dev"
    UI_DOMAIN: $UI_DOMAIN
    UI_SUBDOMAIN: 'www'
    CFN_ROLE_ARN: $CFN_ROLE_ARN_SANDBOX
    DEPLOY_ROLE_ARN: $DEPLOY_ROLE_ARN_SANDBOX
  artifacts:
    paths:
      - ./deploy/static-web-content/cdk.out
  extends:
    - .configure-aws-codeartifact
  script:
    - npm install --force
    - npm run build
    - cd ./deploy/static-web-content
    - npm ci --cache .npm --prefer-offline
    - cd $CI_PROJECT_DIR
    - source ./tools/assume-role.sh
    - cd ./deploy/static-web-content
    - npm run cdk deploy UIResource -- --require-approval never --role-arn $CFN_ROLE_ARN
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

publish-assets:
  stage: release
  extends:
    - .configure-aws-codeartifact
  script:
    - npm install --force
    - npm run build
    - echo "$NPMRC_CONTENT" > .npmrc
    - npm run publish-assets
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  allow_failure: true

